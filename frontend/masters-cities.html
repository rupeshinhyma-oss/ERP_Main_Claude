<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cities — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
        <div class="breadcrumb">
          <a href="./index.html">Dashboard</a><span class="sep">/</span><span class="current">Master Data</span><span class="sep">/</span><span class="current">Cities</span>
        </div>
        <div class="page-header">
          <div>
            <h1>Cities</h1>
            <div class="page-subtitle">Belongs to a state and country; city names are unique within their state.</div>
          </div>
          <div class="page-header-actions">
            <div class="btn file-btn" id="importBtnWrapper">
              Import
              <input type="file" id="importInput" accept=".csv,.xlsx" />
            </div>
            <button class="btn" id="exportCsvBtn">Export CSV</button>
            <button class="btn" id="exportXlsxBtn">Export Excel</button>
            <button class="btn btn-primary" id="newBtn">+ New City</button>
          </div>
        </div>
        <div id="banner"></div>
        <div id="importSummary"></div>

        <div class="card">
          <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search city name..." />
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>City</th>
                  <th>State</th>
                  <th>Country</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="5" class="muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">New City</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <form id="entityForm">
        <input type="hidden" id="entityId" />
        <div class="form-grid">          <div class="field">
            <label for="country_id">Country *</label>
            <select id="country_id" required>
              <option value="">-- Select Country --</option>
            </select>
          </div>
          <div class="field">
            <label for="state_id">State *</label>
            <select id="state_id" required>
              <option value="">-- Select State --</option>
            </select>
          </div>
          <div class="field">
            <label for="name">City Name *</label>
            <input id="name" required maxlength="150" />
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/masters-common.js"></script>
  <script>
    renderShell("masters-cities");

    let countriesCache = [];
    let statesCache = [];

    function countryName(id) {
      const c = countriesCache.find((x) => x.id === id);
      return c ? c.name : "—";
    }
    function stateName(id) {
      const s = statesCache.find((x) => x.id === id);
      return s ? s.name : "—";
    }

    function populateStateOptions(countryId) {
      const stateSelect = document.getElementById("state_id");
      const filtered = countryId ? statesCache.filter((s) => s.country_id === countryId) : statesCache;
      stateSelect.innerHTML = filtered.length 
        ? '<option value="">-- Select State --</option>' 
        : '<option value="">-- No States Found! Create State First --</option>';

      for (const s of filtered) {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        stateSelect.appendChild(opt);
      }
    }

    MasterPage.init({
      apiBase: "/masters/cities",
      permissionPrefix: "city",
      entityName: "city",
      columns: [
        { header: "City", render: (c) => `<span class="cell-primary">${escapeHtml(c.name)}</span>` },
        { header: "State", render: (c) => escapeHtml(stateName(c.state_id)) },
        { header: "Country", render: (c) => escapeHtml(countryName(c.country_id)) },
        { header: "Status", render: (c) => MasterPage.badge(c.status) },
      ],
      async loadLookups() {
        try {
          const [countryRes, stateRes] = await Promise.all([
            apiGet("/masters/countries" + toQueryString({ page: 1, page_size: 250, sort_order: "asc", status: "active" })),
            apiGet("/masters/states" + toQueryString({ page: 1, page_size: 1000, sort_order: "asc", status: "active" })),
          ]);
          countriesCache = countryRes.data || [];
          statesCache = stateRes.data || [];

          const countrySelect = document.getElementById("country_id");
          countrySelect.innerHTML = countriesCache.length 
            ? '<option value="">-- Select Country --</option>' 
            : '<option value="">-- No Countries Found! Create Country First --</option>';

          for (const c of countriesCache) {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = c.name;
            countrySelect.appendChild(opt);
          }
          populateStateOptions(countrySelect.value);
          countrySelect.addEventListener("change", () => populateStateOptions(countrySelect.value));
        } catch (e) {
          /* lookups handling */
        }
      },
      fillForm(item) {
        MasterPage.setFieldValue("country_id", item ? item.country_id : "");
        populateStateOptions(item ? item.country_id : document.getElementById("country_id").value);
        MasterPage.setFieldValue("state_id", item ? item.state_id : "");
        MasterPage.setFieldValue("name", item ? item.name : "");
        MasterPage.setFieldValue("status", item ? item.status : "active");
      },
      toPayload() {
        const cId = MasterPage.fieldValue("country_id");
        const sId = MasterPage.fieldValue("state_id");
        if (!cId) throw new Error("Please select a valid Country.");
        if (!sId) throw new Error("Please select a valid State.");

        return {
          country_id: cId,
          state_id: sId,
          name: MasterPage.fieldValue("name").trim(),
          status: MasterPage.fieldValue("status"),
        };
      },
    });
  </script>
</body>
</html>
