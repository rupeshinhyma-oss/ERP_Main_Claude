<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Departments — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
    <div class="page-header">
      <h1>Departments</h1>
      <button class="btn btn-primary" id="newBtn">New department</button>
    </div>
    <div id="banner"></div>

    <div class="card" id="formCard" style="display: none;">
      <div class="section-title" style="margin-top:0;" id="formTitle">New department</div>
      <form id="deptForm">
        <input type="hidden" id="deptId" />
        <div class="form-grid">
          <div class="field">
            <label for="code">Code *</label>
            <input id="code" required maxlength="50" />
          </div>
          <div class="field">
            <label for="name">Name *</label>
            <input id="name" required maxlength="150" />
          </div>
          <div class="field">
            <label for="parent_department_id">Parent department</label>
            <select id="parent_department_id">
              <option value="">— None —</option>
            </select>
          </div>
          <div class="field">
            <label for="manager_id">Manager</label>
            <select id="manager_id">
              <option value="">— None —</option>
            </select>
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search code or name…" />
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <div class="spacer"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Parent</th>
            <th>Manager</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="muted">Loading…</td></tr>
        </tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("departments");

    const banner = document.getElementById("banner");
    const tableBody = document.getElementById("tableBody");
    const pagination = document.getElementById("pagination");
    const formCard = document.getElementById("formCard");
    const deptForm = document.getElementById("deptForm");
    const canCreate = Auth.hasPermission("department.create");
    const canUpdate = Auth.hasPermission("department.update");
    const canDelete = Auth.hasPermission("department.delete");

    if (!canCreate) document.getElementById("newBtn").style.display = "none";

    let currentPage = 1;
    const pageSize = 20;
    let departmentsCache = [];
    let employeesCache = [];

    async function loadLookups() {
      try {
        const [deptRes, empRes] = await Promise.all([
          apiGet("/departments" + toQueryString({ page: 1, page_size: 100 })),
          apiGet("/employees" + toQueryString({ page: 1, page_size: 100 })),
        ]);
        departmentsCache = deptRes.data;
        employeesCache = empRes.data;

        const parentSelect = document.getElementById("parent_department_id");
        for (const d of departmentsCache) {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = `${d.code} — ${d.name}`;
          parentSelect.appendChild(opt);
        }

        const managerSelect = document.getElementById("manager_id");
        for (const e of employeesCache) {
          const opt = document.createElement("option");
          opt.value = e.id;
          opt.textContent = `${e.display_name} (${e.employee_code})`;
          managerSelect.appendChild(opt);
        }
      } catch (err) {
        /* lookups are a nice-to-have; the table itself still works without them */
      }
    }

    function departmentName(id) {
      const d = departmentsCache.find((x) => x.id === id);
      return d ? d.name : "—";
    }
    function employeeName(id) {
      const e = employeesCache.find((x) => x.id === id);
      return e ? e.display_name : "—";
    }

    function badge(status) {
      const cls = status === "active" ? "badge-active" : "badge-inactive";
      return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
    }

    async function loadTable() {
      tableBody.innerHTML = '<tr><td colspan="6" class="muted">Loading…</td></tr>';
      const params = {
        page: currentPage,
        page_size: pageSize,
        search: document.getElementById("searchInput").value.trim(),
        status: document.getElementById("statusFilter").value,
      };
      try {
        const { data, meta } = await apiGet("/departments" + toQueryString(params));
        if (!data.length) {
          tableBody.innerHTML = '<tr><td colspan="6" class="muted">No departments found.</td></tr>';
        } else {
          tableBody.innerHTML = data
            .map(
              (d) => `
            <tr>
              <td>${escapeHtml(d.code)}</td>
              <td>${escapeHtml(d.name)}</td>
              <td>${d.parent_department_id ? escapeHtml(departmentName(d.parent_department_id)) : "—"}</td>
              <td>${d.manager_id ? escapeHtml(employeeName(d.manager_id)) : "—"}</td>
              <td>${badge(d.status)}</td>
              <td class="actions">
                ${canUpdate ? `<button class="btn btn-small" data-edit="${d.id}">Edit</button>` : ""}
                ${canDelete ? `<button class="btn btn-small btn-danger" data-delete="${d.id}">Delete</button>` : ""}
              </td>
            </tr>`
            )
            .join("");
        }
        renderPagination(meta.pagination);
      } catch (err) {
        tableBody.innerHTML = "";
        showError(banner, err);
      }
    }

    function renderPagination(p) {
      pagination.innerHTML = `
        <button class="btn btn-small" id="prevPage" ${!p.has_previous ? "disabled" : ""}>Previous</button>
        <span class="muted">Page ${p.current_page} of ${p.total_pages || 1} (${p.total_records} total)</span>
        <button class="btn btn-small" id="nextPage" ${!p.has_next ? "disabled" : ""}>Next</button>
      `;
      const prev = document.getElementById("prevPage");
      const next = document.getElementById("nextPage");
      if (prev) prev.addEventListener("click", () => { currentPage--; loadTable(); });
      if (next) next.addEventListener("click", () => { currentPage++; loadTable(); });
    }

    function openForm(dept) {
      deptForm.reset();
      document.getElementById("deptId").value = dept ? dept.id : "";
      document.getElementById("formTitle").textContent = dept ? "Edit department" : "New department";
      document.getElementById("code").value = dept ? dept.code : "";
      document.getElementById("name").value = dept ? dept.name : "";
      document.getElementById("description").value = dept ? dept.description || "" : "";
      document.getElementById("parent_department_id").value = dept ? dept.parent_department_id || "" : "";
      document.getElementById("manager_id").value = dept ? dept.manager_id || "" : "";
      document.getElementById("status").value = dept ? dept.status : "active";
      formCard.style.display = "block";
      formCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("newBtn").addEventListener("click", () => openForm(null));
    document.getElementById("cancelBtn").addEventListener("click", () => {
      formCard.style.display = "none";
    });

    deptForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.innerHTML = "";
      const id = document.getElementById("deptId").value;
      const payload = {
        code: document.getElementById("code").value.trim(),
        name: document.getElementById("name").value.trim(),
        description: document.getElementById("description").value.trim() || null,
        parent_department_id: document.getElementById("parent_department_id").value || null,
        manager_id: document.getElementById("manager_id").value || null,
        status: document.getElementById("status").value,
      };
      try {
        if (id) {
          await apiPatch(`/departments/${id}`, payload);
        } else {
          await apiPost("/departments", payload);
        }
        formCard.style.display = "none";
        await loadLookups();
        await loadTable();
      } catch (err) {
        showError(banner, err);
      }
    });

    tableBody.addEventListener("click", async (e) => {
      const editId = e.target.getAttribute("data-edit");
      const deleteId = e.target.getAttribute("data-delete");
      if (editId) {
        try {
          const { data } = await apiGet(`/departments/${editId}`);
          openForm(data);
        } catch (err) {
          showError(banner, err);
        }
      } else if (deleteId) {
        if (!confirm("Delete this department? This cannot be undone.")) return;
        try {
          await apiDelete(`/departments/${deleteId}`);
          await loadTable();
        } catch (err) {
          showError(banner, err);
        }
      }
    });

    let searchDebounce;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 300);
    });
    document.getElementById("statusFilter").addEventListener("change", () => {
      currentPage = 1;
      loadTable();
    });

    (async () => {
      await loadLookups();
      await loadTable();
    })();
  </script>
      </main>
    </div>
  </div>
</body>
</html>
