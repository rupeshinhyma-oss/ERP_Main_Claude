; =============================================================================
; Alembic Configuration
;
; Note: sqlalchemy.url is intentionally left blank here. The real URL is
; injected at runtime by alembic/env.py from app.core.config.settings, so
; that the database connection string has exactly one source of truth
; (environment variables) instead of being duplicated between .env and
; alembic.ini.
; =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
