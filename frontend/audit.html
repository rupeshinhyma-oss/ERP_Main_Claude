<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit Log — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .detail-pre {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-2);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
        <div class="breadcrumb">
          <a href="./index.html">Dashboard</a><span class="sep">/</span><span class="current">Audit Log</span>
        </div>
        <div class="page-header">
          <div>
            <h1>Audit Log</h1>
            <div class="page-subtitle">A read-only trail of every create, update, delete, login, import, and export action.</div>
          </div>
        </div>
        <div id="banner"></div>

        <div class="card">
          <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search module, entity type, endpoint, description..." />
            <select id="actionFilter">
              <option value="">All actions</option>
              <option value="CREATE">Create</option>
              <option value="UPDATE">Update</option>
              <option value="DELETE">Delete</option>
              <option value="LOGIN">Login</option>
              <option value="LOGIN_FAILED">Login Failed</option>
              <option value="LOGOUT">Logout</option>
              <option value="PASSWORD_CHANGE">Password Change</option>
              <option value="PASSWORD_RESET">Password Reset</option>
              <option value="ROLE_ASSIGNED">Role Assigned</option>
              <option value="ROLE_REMOVED">Role Removed</option>
              <option value="IMPORT">Import</option>
              <option value="EXPORT">Export</option>
              <option value="FILE_UPLOAD">File Upload</option>
              <option value="FILE_DELETE">File Delete</option>
              <option value="OTHER">Other</option>
            </select>
            <input type="text" id="moduleFilter" placeholder="Filter by module (e.g. suppliers)" style="max-width: 220px;" />
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>User</th>
                  <th>Action</th>
                  <th>Module</th>
                  <th>Entity</th>
                  <th>Description</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="8" class="muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card" style="max-width: 720px;">
      <div class="modal-header">
        <h2>Audit Entry Detail</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <div class="detail-grid" id="detailGrid"></div>
      <div class="section-title">Old Values</div>
      <div class="detail-pre" id="oldValues">—</div>
      <div class="section-title">New Values</div>
      <div class="detail-pre" id="newValues">—</div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderShell("audit");

    const banner = document.getElementById("banner");
    const tableBody = document.getElementById("tableBody");
    const pagination = document.getElementById("pagination");
    let currentPage = 1;
    const pageSize = 20;

    function badgeForStatus(code) {
      if (!code) return '<span class="badge badge-neutral">—</span>';
      const cls = code >= 200 && code < 300 ? "badge-active" : code >= 400 ? "badge-danger" : "badge-neutral";
      return `<span class="badge ${cls}">${code}</span>`;
    }

    async function loadTable() {
      tableBody.innerHTML = '<tr><td colspan="8" class="muted">Loading...</td></tr>';
      const params = {
        page: currentPage,
        page_size: pageSize,
        sort_by: "created_at",
        sort_order: "desc",
        search: document.getElementById("searchInput").value.trim(),
        action: document.getElementById("actionFilter").value,
        module: document.getElementById("moduleFilter").value.trim(),
      };
      try {
        const { data, meta } = await apiGet("/audit" + toQueryString(params));
        if (!data.length) {
          tableBody.innerHTML = '<tr><td colspan="8" class="muted">No audit entries found.</td></tr>';
        } else {
          tableBody.innerHTML = data.map((entry) => `
            <tr>
              <td>${new Date(entry.created_at).toLocaleString()}</td>
              <td>${escapeHtml(entry.username_snapshot || "System")}</td>
              <td><span class="badge badge-neutral">${escapeHtml(entry.action)}</span></td>
              <td>${escapeHtml(entry.module)}</td>
              <td>${entry.entity_type ? escapeHtml(entry.entity_type) : "—"}${entry.entity_id ? `<br><span class="cell-secondary">${escapeHtml(entry.entity_id)}</span>` : ""}</td>
              <td>${entry.description ? escapeHtml(entry.description).slice(0, 80) : "—"}</td>
              <td>${badgeForStatus(entry.response_status)}</td>
              <td class="actions"><button class="btn btn-small" data-view="${entry.id}">View</button></td>
            </tr>`).join("");
        }
        renderPagination(meta.pagination);
      } catch (err) {
        tableBody.innerHTML = "";
        showError(banner, err);
      }
    }

    function renderPagination(p) {
      pagination.innerHTML = `
        <span class="muted">Page ${p.current_page} of ${p.total_pages || 1} &middot; ${p.total_records} total</span>
        <div>
          <button class="btn btn-small" id="prevPage" ${!p.has_previous ? "disabled" : ""}>Previous</button>
          <button class="btn btn-small" id="nextPage" ${!p.has_next ? "disabled" : ""}>Next</button>
        </div>`;
      const prev = document.getElementById("prevPage");
      const next = document.getElementById("nextPage");
      if (prev) prev.addEventListener("click", () => { currentPage--; loadTable(); });
      if (next) next.addEventListener("click", () => { currentPage++; loadTable(); });
    }

    async function openDetail(id) {
      try {
        const { data: entry } = await apiGet(`/audit/${id}`);
        document.getElementById("detailGrid").innerHTML = `
          <div><div class="label">Time</div><div class="value">${new Date(entry.created_at).toLocaleString()}</div></div>
          <div><div class="label">User</div><div class="value">${escapeHtml(entry.username_snapshot || "System")}</div></div>
          <div><div class="label">Action</div><div class="value">${escapeHtml(entry.action)}</div></div>
          <div><div class="label">Module</div><div class="value">${escapeHtml(entry.module)}</div></div>
          <div><div class="label">Entity Type</div><div class="value">${entry.entity_type ? escapeHtml(entry.entity_type) : "—"}</div></div>
          <div><div class="label">Entity ID</div><div class="value">${entry.entity_id ? escapeHtml(entry.entity_id) : "—"}</div></div>
          <div><div class="label">HTTP Method</div><div class="value">${entry.http_method ? escapeHtml(entry.http_method) : "—"}</div></div>
          <div><div class="label">Endpoint</div><div class="value">${entry.endpoint ? escapeHtml(entry.endpoint) : "—"}</div></div>
          <div><div class="label">Response Status</div><div class="value">${badgeForStatus(entry.response_status)}</div></div>
          <div><div class="label">IP Address</div><div class="value">${entry.ip_address ? escapeHtml(entry.ip_address) : "—"}</div></div>
          <div><div class="label">Request ID</div><div class="value">${entry.request_id ? escapeHtml(entry.request_id) : "—"}</div></div>
          <div><div class="label">Description</div><div class="value">${entry.description ? escapeHtml(entry.description) : "—"}</div></div>
        `;
        document.getElementById("oldValues").textContent = entry.old_values || "—";
        document.getElementById("newValues").textContent = entry.new_values || "—";
        document.getElementById("modalBackdrop").style.display = "flex";
      } catch (err) {
        showError(banner, err);
      }
    }

    tableBody.addEventListener("click", (e) => {
      const viewId = e.target.getAttribute("data-view");
      if (viewId) openDetail(viewId);
    });
    document.getElementById("modalCloseBtn").addEventListener("click", () => {
      document.getElementById("modalBackdrop").style.display = "none";
    });
    document.getElementById("modalBackdrop").addEventListener("click", (e) => {
      if (e.target === document.getElementById("modalBackdrop")) {
        document.getElementById("modalBackdrop").style.display = "none";
      }
    });

    let searchDebounce;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 300);
    });
    document.getElementById("actionFilter").addEventListener("change", () => { currentPage = 1; loadTable(); });
    document.getElementById("moduleFilter").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 300);
    });

    loadTable();
  </script>
</body>
</html>
