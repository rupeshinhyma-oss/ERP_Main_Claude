<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Designations — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
    <div class="page-header">
      <h1>Designations</h1>
      <button class="btn btn-primary" id="newBtn">New designation</button>
    </div>
    <div id="banner"></div>

    <div class="card" id="formCard" style="display: none;">
      <div class="section-title" style="margin-top:0;" id="formTitle">New designation</div>
      <form id="desigForm">
        <input type="hidden" id="desigId" />
        <div class="form-grid">
          <div class="field">
            <label for="code">Code *</label>
            <input id="code" required maxlength="50" />
          </div>
          <div class="field">
            <label for="title">Title *</label>
            <input id="title" required maxlength="150" />
          </div>
          <div class="field">
            <label for="level">Level</label>
            <input id="level" type="number" min="0" max="100" />
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search code or title…" />
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <div class="spacer"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Level</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="5" class="muted">Loading…</td></tr>
        </tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("designations");

    const banner = document.getElementById("banner");
    const tableBody = document.getElementById("tableBody");
    const pagination = document.getElementById("pagination");
    const formCard = document.getElementById("formCard");
    const desigForm = document.getElementById("desigForm");
    const canCreate = Auth.hasPermission("designation.create");
    const canUpdate = Auth.hasPermission("designation.update");
    const canDelete = Auth.hasPermission("designation.delete");

    if (!canCreate) document.getElementById("newBtn").style.display = "none";

    let currentPage = 1;
    const pageSize = 20;

    function badge(status) {
      const cls = status === "active" ? "badge-active" : "badge-inactive";
      return `<span class="badge ${cls}">${escapeHtml(status)}</span>`;
    }

    async function loadTable() {
      tableBody.innerHTML = '<tr><td colspan="5" class="muted">Loading…</td></tr>';
      const params = {
        page: currentPage,
        page_size: pageSize,
        search: document.getElementById("searchInput").value.trim(),
        status: document.getElementById("statusFilter").value,
      };
      try {
        const { data, meta } = await apiGet("/designations" + toQueryString(params));
        if (!data.length) {
          tableBody.innerHTML = '<tr><td colspan="5" class="muted">No designations found.</td></tr>';
        } else {
          tableBody.innerHTML = data
            .map(
              (d) => `
            <tr>
              <td>${escapeHtml(d.code)}</td>
              <td>${escapeHtml(d.title)}</td>
              <td>${d.level ?? "—"}</td>
              <td>${badge(d.status)}</td>
              <td class="actions">
                ${canUpdate ? `<button class="btn btn-small" data-edit="${d.id}">Edit</button>` : ""}
                ${canDelete ? `<button class="btn btn-small btn-danger" data-delete="${d.id}">Delete</button>` : ""}
              </td>
            </tr>`
            )
            .join("");
        }
        renderPagination(meta.pagination);
      } catch (err) {
        tableBody.innerHTML = "";
        showError(banner, err);
      }
    }

    function renderPagination(p) {
      pagination.innerHTML = `
        <button class="btn btn-small" id="prevPage" ${!p.has_previous ? "disabled" : ""}>Previous</button>
        <span class="muted">Page ${p.current_page} of ${p.total_pages || 1} (${p.total_records} total)</span>
        <button class="btn btn-small" id="nextPage" ${!p.has_next ? "disabled" : ""}>Next</button>
      `;
      const prev = document.getElementById("prevPage");
      const next = document.getElementById("nextPage");
      if (prev) prev.addEventListener("click", () => { currentPage--; loadTable(); });
      if (next) next.addEventListener("click", () => { currentPage++; loadTable(); });
    }

    function openForm(desig) {
      desigForm.reset();
      document.getElementById("desigId").value = desig ? desig.id : "";
      document.getElementById("formTitle").textContent = desig ? "Edit designation" : "New designation";
      document.getElementById("code").value = desig ? desig.code : "";
      document.getElementById("title").value = desig ? desig.title : "";
      document.getElementById("level").value = desig && desig.level !== null ? desig.level : "";
      document.getElementById("description").value = desig ? desig.description || "" : "";
      document.getElementById("status").value = desig ? desig.status : "active";
      formCard.style.display = "block";
      formCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    document.getElementById("newBtn").addEventListener("click", () => openForm(null));
    document.getElementById("cancelBtn").addEventListener("click", () => {
      formCard.style.display = "none";
    });

    desigForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.innerHTML = "";
      const id = document.getElementById("desigId").value;
      const levelRaw = document.getElementById("level").value;
      const payload = {
        code: document.getElementById("code").value.trim(),
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim() || null,
        level: levelRaw === "" ? null : Number(levelRaw),
        status: document.getElementById("status").value,
      };
      try {
        if (id) {
          await apiPatch(`/designations/${id}`, payload);
        } else {
          await apiPost("/designations", payload);
        }
        formCard.style.display = "none";
        await loadTable();
      } catch (err) {
        showError(banner, err);
      }
    });

    tableBody.addEventListener("click", async (e) => {
      const editId = e.target.getAttribute("data-edit");
      const deleteId = e.target.getAttribute("data-delete");
      if (editId) {
        try {
          const { data } = await apiGet(`/designations/${editId}`);
          openForm(data);
        } catch (err) {
          showError(banner, err);
        }
      } else if (deleteId) {
        if (!confirm("Delete this designation? This cannot be undone.")) return;
        try {
          await apiDelete(`/designations/${deleteId}`);
          await loadTable();
        } catch (err) {
          showError(banner, err);
        }
      }
    });

    let searchDebounce;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 300);
    });
    document.getElementById("statusFilter").addEventListener("change", () => {
      currentPage = 1;
      loadTable();
    });

    loadTable();
  </script>
      </main>
    </div>
  </div>
</body>
</html>
