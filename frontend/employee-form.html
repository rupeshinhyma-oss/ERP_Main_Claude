<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
    <div class="page-header">
      <h1 id="pageTitle">New employee</h1>
    </div>
    <div id="banner"></div>

    <div class="card">
      <form id="empForm">
        <div class="section-title" style="margin-top:0;">Personal details</div>
        <div class="form-grid">
          <div class="field">
            <label for="first_name">First name *</label>
            <input id="first_name" required maxlength="100" />
          </div>
          <div class="field">
            <label for="middle_name">Middle name</label>
            <input id="middle_name" maxlength="100" />
          </div>
          <div class="field">
            <label for="last_name">Last name *</label>
            <input id="last_name" required maxlength="100" />
          </div>
          <div class="field">
            <label for="display_name">Display name</label>
            <input id="display_name" maxlength="200" placeholder="Defaults to full name" />
          </div>
          <div class="field">
            <label for="date_of_birth">Date of birth</label>
            <input id="date_of_birth" type="date" />
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender">
              <option value="">— Not specified —</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
              <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
            </select>
          </div>
        </div>

        <div class="section-title">Contact</div>
        <div class="form-grid">
          <div class="field">
            <label for="email">Email *</label>
            <input id="email" type="email" required />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" maxlength="30" />
          </div>
          <div class="field">
            <label for="emergency_contact">Emergency contact</label>
            <input id="emergency_contact" maxlength="255" />
          </div>
        </div>

        <div class="section-title">Employment</div>
        <div class="form-grid">
          <div class="field">
            <label for="date_of_joining">Date of joining *</label>
            <input id="date_of_joining" type="date" required />
          </div>
          <div class="field">
            <label for="employment_type">Employment type</label>
            <select id="employment_type">
              <option value="FULL_TIME">Full time</option>
              <option value="PART_TIME">Part time</option>
              <option value="CONTRACT">Contract</option>
              <option value="INTERN">Intern</option>
              <option value="TEMPORARY">Temporary</option>
            </select>
          </div>
          <div class="field">
            <label for="department_id">Department</label>
            <select id="department_id"><option value="">— None —</option></select>
          </div>
          <div class="field">
            <label for="designation_id">Designation</label>
            <select id="designation_id"><option value="">— None —</option></select>
          </div>
          <div class="field">
            <label for="manager_id">Manager</label>
            <select id="manager_id"><option value="">— None —</option></select>
          </div>
        </div>

        <div class="section-title">Profile picture</div>
        <div class="field">
          <label for="profile_picture_url">Profile picture URL</label>
          <input id="profile_picture_url" type="url" maxlength="500" placeholder="https://…" />
        </div>

        <div class="section-title">Address</div>
        <div class="field">
          <label for="address">Address</label>
          <textarea id="address"></textarea>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="city">City</label>
            <input id="city" maxlength="100" />
          </div>
          <div class="field">
            <label for="state">State</label>
            <input id="state" maxlength="100" />
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input id="country" maxlength="100" />
          </div>
          <div class="field">
            <label for="postal_code">Postal code</label>
            <input id="postal_code" maxlength="20" />
          </div>
        </div>

        <div class="section-title">Notes</div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes"></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
          <a class="btn" id="cancelLink" href="./teams.html">Cancel</a>
        </div>
      </form>
    </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("teams");

    const banner = document.getElementById("banner");
    const form = document.getElementById("empForm");
    const saveBtn = document.getElementById("saveBtn");
    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("id");
    const isEdit = Boolean(employeeId);

    if (isEdit) {
      document.getElementById("pageTitle").textContent = "Edit employee";
      document.getElementById("cancelLink").href = `./employee-detail.html?id=${employeeId}`;
    }

    async function loadLookups() {
      const [deptRes, desigRes, empRes] = await Promise.all([
        apiGet("/departments" + toQueryString({ page: 1, page_size: 100 })),
        apiGet("/designations" + toQueryString({ page: 1, page_size: 100 })),
        apiGet("/employees" + toQueryString({ page: 1, page_size: 100 })),
      ]);

      const deptSelect = document.getElementById("department_id");
      for (const d of deptRes.data) {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = `${d.code} — ${d.name}`;
        deptSelect.appendChild(opt);
      }
      const desigSelect = document.getElementById("designation_id");
      for (const d of desigRes.data) {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.title;
        desigSelect.appendChild(opt);
      }
      const managerSelect = document.getElementById("manager_id");
      for (const e of empRes.data) {
        if (e.id === employeeId) continue;
        const opt = document.createElement("option");
        opt.value = e.id;
        opt.textContent = `${e.display_name} (${e.employee_code})`;
        managerSelect.appendChild(opt);
      }
    }

    function fillForm(e) {
      document.getElementById("first_name").value = e.first_name;
      document.getElementById("middle_name").value = e.middle_name || "";
      document.getElementById("last_name").value = e.last_name;
      document.getElementById("display_name").value = e.display_name || "";
      document.getElementById("date_of_birth").value = e.date_of_birth || "";
      document.getElementById("gender").value = e.gender || "";
      document.getElementById("email").value = e.email;
      document.getElementById("phone").value = e.phone || "";
      document.getElementById("emergency_contact").value = e.emergency_contact || "";
      document.getElementById("date_of_joining").value = e.date_of_joining;
      document.getElementById("employment_type").value = e.employment_type;
      document.getElementById("department_id").value = e.department_id || "";
      document.getElementById("designation_id").value = e.designation_id || "";
      document.getElementById("manager_id").value = e.manager_id || "";
      document.getElementById("profile_picture_url").value = e.profile_picture_url || "";
      document.getElementById("address").value = e.address || "";
      document.getElementById("city").value = e.city || "";
      document.getElementById("state").value = e.state || "";
      document.getElementById("country").value = e.country || "";
      document.getElementById("postal_code").value = e.postal_code || "";
      document.getElementById("notes").value = e.notes || "";
      // department/designation/manager are changed via dedicated endpoints on
      // the detail page, not this form, once an employee already exists.
      if (isEdit) {
        for (const id of ["department_id", "designation_id", "manager_id"]) {
          document.getElementById(id).disabled = true;
        }
      }
    }

    function readForm() {
      return {
        first_name: document.getElementById("first_name").value.trim(),
        middle_name: document.getElementById("middle_name").value.trim() || null,
        last_name: document.getElementById("last_name").value.trim(),
        display_name: document.getElementById("display_name").value.trim() || null,
        date_of_birth: document.getElementById("date_of_birth").value || null,
        gender: document.getElementById("gender").value || null,
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim() || null,
        emergency_contact: document.getElementById("emergency_contact").value.trim() || null,
        date_of_joining: document.getElementById("date_of_joining").value,
        employment_type: document.getElementById("employment_type").value,
        department_id: document.getElementById("department_id").value || null,
        designation_id: document.getElementById("designation_id").value || null,
        manager_id: document.getElementById("manager_id").value || null,
        profile_picture_url: document.getElementById("profile_picture_url").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        city: document.getElementById("city").value.trim() || null,
        state: document.getElementById("state").value.trim() || null,
        country: document.getElementById("country").value.trim() || null,
        postal_code: document.getElementById("postal_code").value.trim() || null,
        notes: document.getElementById("notes").value.trim() || null,
      };
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.innerHTML = "";
      saveBtn.disabled = true;
      const payload = readForm();

      try {
        if (isEdit) {
          // These fields aren't part of EmployeeUpdate — they're changed via
          // the dedicated transfer/change-designation/assign-manager actions.
          delete payload.department_id;
          delete payload.designation_id;
          delete payload.manager_id;
          await apiPatch(`/employees/${employeeId}`, payload);
          window.location.href = `./employee-detail.html?id=${employeeId}`;
        } else {
          const { data } = await apiPost("/employees", payload);
          window.location.href = `./employee-detail.html?id=${data.id}`;
        }
      } catch (err) {
        showError(banner, err);
        saveBtn.disabled = false;
      }
    });

    (async () => {
      try {
        await loadLookups();
        if (isEdit) {
          const { data } = await apiGet(`/employees/${employeeId}`);
          fillForm(data);
        }
      } catch (err) {
        showError(banner, err);
      }
    })();
  </script>
      </main>
    </div>
  </div>
</body>
</html>
