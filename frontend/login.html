<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Yinglima ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    html {
      height: 100%;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6fb;
      color: #1e293b;
      padding: 24px;
      width: 100%;
    }
    .login-container {
      width: 100%;
      max-width: 1020px;
      min-height: 580px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 60px -12px rgba(15, 23, 42, 0.12);
      display: flex;
      overflow: hidden;
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin: 0 auto;
    }
    .left-pane {
      flex: 1.1;
      background: linear-gradient(135deg, #f8fafc 0%, #eff3f8 100%);
      padding: 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border-right: 1px solid #e8edf4;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      background: #2563eb;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #0f172a;
    }
    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #2563eb;
    }
    .illustration-wrapper {
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .illustration-svg {
      width: 100%;
      max-width: 320px;
      height: auto;
    }
    .left-footer-title {
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .left-footer-desc {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .right-pane {
      flex: 1;
      padding: 52px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #ffffff;
    }
    .form-title {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      width: 18px;
      height: 18px;
      pointer-events: none;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      color: #0f172a;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .eye-toggle {
      position: absolute;
      right: 14px;
      color: #94a3b8;
      cursor: pointer;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-toggle:hover { color: #475569; }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #475569;
      cursor: pointer;
      font-weight: 500;
    }
    .remember-me input {
      accent-color: #1e3a8a;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .forgot-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-link:hover { text-decoration: underline; }
    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #1e3a8a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }
    .submit-btn:hover { background: #1e40af; }
    .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    #banner { margin-bottom: 16px; }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
    @media (max-width: 768px) {
      .login-container { flex-direction: column; }
      .left-pane { display: none; }
      .right-pane { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Left Pane: Branding & Illustration -->
    <div class="left-pane">
      <div class="brand-header">
        <div class="brand-logo">Y</div>
        <div>
          <div class="brand-name">YINGLIMA</div>
          <div class="brand-sub">PROCUREMENT &amp; ERP</div>
        </div>
      </div>

      <div class="illustration-wrapper">
        <svg class="illustration-svg" viewBox="0 0 360 260" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Background Screens -->
          <rect x="220" y="30" width="110" height="70" rx="10" fill="#3B82F6" />
          <rect x="235" y="45" width="80" height="12" rx="4" fill="#60A5FA" />
          <rect x="235" y="65" width="50" height="12" rx="4" fill="#93C5FD" />

          <rect x="180" y="110" width="150" height="80" rx="10" fill="#1E3A8A" />
          <rect x="300" y="125" width="18" height="18" rx="4" fill="#FFFFFF" />

          <rect x="60" y="80" width="110" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3" />
          <rect x="75" y="100" width="45" height="25" rx="4" fill="#3B82F6" />
          <rect x="130" y="100" width="30" height="8" rx="3" fill="#94A3B8" />

          <!-- Desk -->
          <path d="M70 200 L320 200" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
          <path d="M100 200 L100 240" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
          <path d="M290 200 L310 240" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />

          <!-- Laptop & Character -->
          <rect x="110" y="170" width="50" height="30" rx="4" fill="#60A5FA" />
          <path d="M100 200 L170 200" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
          
          <circle cx="210" cy="130" r="16" fill="#F87171" />
          <path d="M195 150 C195 140 225 140 225 150 L225 240 L210 240 L210 180 L195 180 Z" fill="#2563EB" />
          
          <circle cx="120" cy="185" r="8" fill="#10B981" />
          <rect x="118" y="193" width="4" height="7" fill="#047857" />
        </svg>
      </div>

      <div class="left-footer">
        <div class="left-footer-title">Yinglima Procurement &amp; Enterprise ERP System</div>
        <div class="left-footer-desc">Secure multi-tenant inventory, supplier &amp; consignment management</div>
      </div>
    </div>

    <!-- Right Pane: Sign In Form -->
    <div class="right-pane">
      <div class="form-title">Sign In</div>
      <div class="form-subtitle">Welcome back! Please enter your details.</div>
      
      <div id="banner"></div>

      <form id="loginForm">
        <div class="input-group">
          <label class="input-label" for="identifier">Email address or Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="input-field" id="identifier" name="identifier" type="text" placeholder="user@gmail.com" required autocomplete="username" />
          </div>
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input class="input-field" id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
            <div class="eye-toggle" id="togglePassword">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" onclick="alert('Please contact your system administrator to reset your password.'); return false;">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function initials(name) {
      if (!name) return "ERP";
      return name.trim().slice(0, 2).toUpperCase();
    }

    async function loadOrgInfo() {
      if (!Auth.isLoggedIn()) return;
      try {
        const { data } = await apiGet("/organizations");
        if (data && data.company_name) {
          const name = data.company_name;
          sessionStorage.setItem("erp_org_company_name", name);
          document.title = `Log in — ${name}`;
          const brandTitle = document.querySelector(".login-brand .brand-title");
          const logoMark = document.querySelector(".login-brand .logo-mark");
          if (brandTitle) brandTitle.textContent = name;
          if (logoMark) logoMark.textContent = initials(name);
        }
      } catch (e) {
        /* fallback to default */
      }
    }

    if (Auth.isLoggedIn()) {
      window.location.href = "./index.html";
    } else {
      Auth.clear();
    }
    loadOrgInfo();

    const form = document.getElementById("loginForm");
    const banner = document.getElementById("banner");
    const submitBtn = document.getElementById("submitBtn");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    // Toggle password visibility
    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeIcon.innerHTML = isPassword
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      banner.innerHTML = "";
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Signing In...</span>';

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data: tokens } = await apiPost("/auth/login", { identifier, password });
        Auth.setSession(tokens);

        const { data: profile } = await apiGet("/auth/profile");
        Auth.updateProfile(profile);

        window.location.href = "./index.html";
      } catch (err) {
        showError(banner, err);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      }
    });
  </script>
</body>
</html>
