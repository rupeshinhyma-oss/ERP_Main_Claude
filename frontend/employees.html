<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employees — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
    <div class="page-header">
      <h1>Employees</h1>
      <a class="btn btn-primary" id="newBtn" href="./employee-form.html">New employee</a>
    </div>
    <div id="banner"></div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search name, code, email, phone…" />
        <select id="departmentFilter"><option value="">All departments</option></select>
        <select id="designationFilter"><option value="">All designations</option></select>
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="ACTIVE">Active</option>
          <option value="INACTIVE">Inactive</option>
          <option value="ON_LEAVE">On leave</option>
          <option value="TERMINATED">Terminated</option>
          <option value="RESIGNED">Resigned</option>
        </select>
        <div class="spacer"></div>
        <select id="sortSelect">
          <option value="display_name">Sort: Name</option>
          <option value="employee_code">Sort: Employee code</option>
          <option value="date_of_joining">Sort: Date of joining</option>
          <option value="created_at">Sort: Newest</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Department</th>
            <th>Designation</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="muted">Loading…</td></tr>
        </tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("employees");

    const banner = document.getElementById("banner");
    const tableBody = document.getElementById("tableBody");
    const pagination = document.getElementById("pagination");
    if (!Auth.hasPermission("employee.create")) document.getElementById("newBtn").style.display = "none";

    let currentPage = 1;
    const pageSize = 20;
    let departmentsCache = [];
    let designationsCache = [];

    function statusBadgeClass(status) {
      if (status === "ACTIVE") return "badge-active";
      if (status === "INACTIVE" || status === "TERMINATED" || status === "RESIGNED") return "badge-inactive";
      return "badge-neutral";
    }

    async function loadLookups() {
      try {
        const [deptRes, desigRes] = await Promise.all([
          apiGet("/departments" + toQueryString({ page: 1, page_size: 100 })),
          apiGet("/designations" + toQueryString({ page: 1, page_size: 100 })),
        ]);
        departmentsCache = deptRes.data;
        designationsCache = desigRes.data;

        const deptSelect = document.getElementById("departmentFilter");
        for (const d of departmentsCache) {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.name;
          deptSelect.appendChild(opt);
        }
        const desigSelect = document.getElementById("designationFilter");
        for (const d of designationsCache) {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.title;
          desigSelect.appendChild(opt);
        }
      } catch (err) {
        /* filters degrade gracefully without lookups */
      }
    }

    function departmentName(id) {
      const d = departmentsCache.find((x) => x.id === id);
      return d ? d.name : "—";
    }
    function designationTitle(id) {
      const d = designationsCache.find((x) => x.id === id);
      return d ? d.title : "—";
    }

    async function loadTable() {
      tableBody.innerHTML = '<tr><td colspan="6" class="muted">Loading…</td></tr>';
      const params = {
        page: currentPage,
        page_size: pageSize,
        search: document.getElementById("searchInput").value.trim(),
        department_id: document.getElementById("departmentFilter").value,
        designation_id: document.getElementById("designationFilter").value,
        employment_status: document.getElementById("statusFilter").value,
        sort_by: document.getElementById("sortSelect").value,
        sort_order: document.getElementById("sortSelect").value === "created_at" ? "desc" : "asc",
      };
      try {
        const { data, meta } = await apiGet("/employees" + toQueryString(params));
        if (!data.length) {
          tableBody.innerHTML = '<tr><td colspan="6" class="muted">No employees found.</td></tr>';
        } else {
          tableBody.innerHTML = data
            .map(
              (e) => `
            <tr>
              <td>${escapeHtml(e.employee_code)}</td>
              <td><a href="./employee-detail.html?id=${e.id}">${escapeHtml(e.display_name)}</a></td>
              <td>${e.department_id ? escapeHtml(departmentName(e.department_id)) : "—"}</td>
              <td>${e.designation_id ? escapeHtml(designationTitle(e.designation_id)) : "—"}</td>
              <td><span class="badge ${statusBadgeClass(e.employment_status)}">${escapeHtml(e.employment_status)}</span></td>
              <td class="actions">
                <a class="btn btn-small" href="./employee-detail.html?id=${e.id}">View</a>
              </td>
            </tr>`
            )
            .join("");
        }
        renderPagination(meta.pagination);
      } catch (err) {
        tableBody.innerHTML = "";
        showError(banner, err);
      }
    }

    function renderPagination(p) {
      pagination.innerHTML = `
        <button class="btn btn-small" id="prevPage" ${!p.has_previous ? "disabled" : ""}>Previous</button>
        <span class="muted">Page ${p.current_page} of ${p.total_pages || 1} (${p.total_records} total)</span>
        <button class="btn btn-small" id="nextPage" ${!p.has_next ? "disabled" : ""}>Next</button>
      `;
      const prev = document.getElementById("prevPage");
      const next = document.getElementById("nextPage");
      if (prev) prev.addEventListener("click", () => { currentPage--; loadTable(); });
      if (next) next.addEventListener("click", () => { currentPage++; loadTable(); });
    }

    let searchDebounce;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadTable(); }, 300);
    });
    for (const id of ["departmentFilter", "designationFilter", "statusFilter", "sortSelect"]) {
      document.getElementById(id).addEventListener("change", () => { currentPage = 1; loadTable(); });
    }

    (async () => {
      await loadLookups();
      await loadTable();
    })();
  </script>
      </main>
    </div>
  </div>
</body>
</html>
