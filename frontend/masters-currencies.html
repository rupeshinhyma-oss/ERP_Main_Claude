<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currencies — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
        <div class="breadcrumb">
          <a href="./index.html">Dashboard</a><span class="sep">/</span><span class="current">Master Data</span><span class="sep">/</span><span class="current">Currencies</span>
        </div>
        <div class="page-header">
          <div>
            <h1>Currencies</h1>
            <div class="page-subtitle">Reference currencies for pricing, invoicing, and finance.</div>
          </div>
          <div class="page-header-actions">
            <div class="btn file-btn" id="importBtnWrapper">
              Import
              <input type="file" id="importInput" accept=".csv,.xlsx" />
            </div>
            <button class="btn" id="exportCsvBtn">Export CSV</button>
            <button class="btn" id="exportXlsxBtn">Export Excel</button>
            <button class="btn btn-primary" id="newBtn">+ New Currency</button>
          </div>
        </div>
        <div id="banner"></div>
        <div id="importSummary"></div>

        <div class="card">
          <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search name or code or Sr. No..." />
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th style="width: 40px;"><input type="checkbox" class="select-all-checkbox" /></th>
                  <th>Sr. No.</th>
                  <th>Name</th>
                  <th>Code</th>
                  <th>Symbol</th>
                  <th>Decimal Places</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="6" class="muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">New Currency</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <form id="entityForm">
        <input type="hidden" id="entityId" />
        <div class="form-grid">
          <div class="field">
            <label for="name">Currency Name *</label>
            <input id="name" required maxlength="100" />
          </div>
          <div class="field">
            <label for="code">Currency Code *</label>
            <input id="code" required maxlength="10" placeholder="INR" />
          </div>
          <div class="field">
            <label for="symbol">Currency Symbol</label>
            <input id="symbol" maxlength="10" placeholder="₹" />
          </div>
          <div class="field">
            <label for="decimal_places">Decimal Places</label>
            <input id="decimal_places" type="number" min="0" max="6" value="2" />
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/import-wizard.js"></script>
  <script src="js/masters-common.js"></script>
  <script>
    renderShell("masters-currencies");

    MasterPage.init({
      apiBase: "/masters/currencies",
      permissionPrefix: "currency",
      entityName: "currency",
      importHeaders: [
        { key: "name", label: "Currency Name", required: true },
        { key: "code", label: "Currency Code (ISO 4217)", required: true },
        { key: "symbol", label: "Symbol" },
        { key: "decimal_places", label: "Decimal Places" },
        { key: "status", label: "Status (active/inactive)" },
      ],
      columns: [
        { header: "Name", render: (c) => `<span class="cell-primary">${escapeHtml(c.name)}</span>` },
        { header: "Code", render: (c) => escapeHtml(c.code) },
        { header: "Symbol", render: (c) => escapeHtml(c.symbol || "—") },
        { header: "Decimal Places", render: (c) => c.decimal_places },
        { header: "Status", render: (c) => MasterPage.badge(c.status) },
      ],
      fillForm(item) {
        MasterPage.setFieldValue("name", item ? item.name : "");
        MasterPage.setFieldValue("code", item ? item.code : "");
        MasterPage.setFieldValue("symbol", item ? item.symbol : "");
        MasterPage.setFieldValue("decimal_places", item ? item.decimal_places : 2);
        MasterPage.setFieldValue("status", item ? item.status : "active");
      },
      toPayload() {
        return {
          name: MasterPage.fieldValue("name").trim(),
          code: MasterPage.fieldValue("code").trim(),
          symbol: MasterPage.fieldValue("symbol").trim() || null,
          decimal_places: parseInt(MasterPage.fieldValue("decimal_places"), 10) || 0,
          status: MasterPage.fieldValue("status"),
        };
      },
    });
  </script>
</body>
</html>
