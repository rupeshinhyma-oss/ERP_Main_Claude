<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
    <div class="page-header">
      <h1 id="pageTitle">Employee</h1>
      <div>
        <a class="btn" id="editBtn" href="#">Edit</a>
        <button class="btn btn-danger" id="deleteBtn">Delete</button>
      </div>
    </div>
    <div id="banner"></div>

    <div class="card">
      <div class="detail-grid">
        <div><div class="label">Employee code</div><div class="value" id="v_employee_code">—</div></div>
        <div><div class="label">Status</div><div class="value" id="v_status">—</div></div>
        <div><div class="label">Email</div><div class="value" id="v_email">—</div></div>
        <div><div class="label">Phone</div><div class="value" id="v_phone">—</div></div>
        <div><div class="label">Department</div><div class="value" id="v_department">—</div></div>
        <div><div class="label">Designation</div><div class="value" id="v_designation">—</div></div>
        <div><div class="label">Manager</div><div class="value" id="v_manager">—</div></div>
        <div><div class="label">Employment type</div><div class="value" id="v_employment_type">—</div></div>
        <div><div class="label">Date of joining</div><div class="value" id="v_date_of_joining">—</div></div>
        <div><div class="label">Date of birth</div><div class="value" id="v_date_of_birth">—</div></div>
        <div><div class="label">Gender</div><div class="value" id="v_gender">—</div></div>
        <div><div class="label">Linked user account</div><div class="value" id="v_user">—</div></div>
        <div><div class="label">Profile picture</div><div class="value" id="v_profile_picture">—</div></div>
      </div>

      <div class="section-title">Address</div>
      <div class="detail-grid">
        <div><div class="label">Address</div><div class="value" id="v_address">—</div></div>
        <div><div class="label">City</div><div class="value" id="v_city">—</div></div>
        <div><div class="label">State</div><div class="value" id="v_state">—</div></div>
        <div><div class="label">Country</div><div class="value" id="v_country">—</div></div>
        <div><div class="label">Postal code</div><div class="value" id="v_postal_code">—</div></div>
        <div><div class="label">Emergency contact</div><div class="value" id="v_emergency_contact">—</div></div>
      </div>

      <div class="section-title" id="notesTitle" style="display:none;">Notes</div>
      <p id="v_notes" class="muted" style="display:none;"></p>
    </div>

    <div class="card" id="actionsCard">
      <div class="section-title" style="margin-top:0;">Actions</div>

      <div class="form-grid">
        <div class="field">
          <label for="transferDept">Transfer to department</label>
          <select id="transferDept"><option value="">Select department…</option></select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="transferBtn">Transfer</button>
        </div>

        <div class="field">
          <label for="changeDesig">Change designation</label>
          <select id="changeDesig"><option value="">Select designation…</option></select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="desigBtn">Change</button>
        </div>

        <div class="field">
          <label for="assignManager">Assign manager</label>
          <select id="assignManager"><option value="">— None —</option></select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button class="btn" id="managerBtn">Assign</button>
        </div>

        <div class="field" id="linkUserField">
          <label for="linkUser">Link user account</label>
          <select id="linkUser"><option value="">Select user…</option></select>
        </div>
        <div class="field" id="linkUserBtnField">
          <label>&nbsp;</label>
          <button class="btn" id="linkUserBtn">Link</button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" id="deactivateBtn">Deactivate</button>
        <button class="btn" id="reactivateBtn">Reactivate</button>
      </div>
    </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    renderNav("employees");

    const banner = document.getElementById("banner");
    const params = new URLSearchParams(window.location.search);
    const employeeId = params.get("id");
    if (!employeeId) {
      window.location.href = "./employees.html";
    }

    const canUpdate = Auth.hasPermission("employee.update");
    const canDelete = Auth.hasPermission("employee.delete");
    const canReadUsers = Auth.hasPermission("user.read");

    document.getElementById("editBtn").href = `./employee-form.html?id=${employeeId}`;
    if (!canUpdate) document.getElementById("editBtn").style.display = "none";
    if (!canDelete) document.getElementById("deleteBtn").style.display = "none";
    if (!canUpdate) document.getElementById("actionsCard").style.display = "none";

    let departmentsCache = [];
    let designationsCache = [];
    let employeesCache = [];

    function setText(id, value) {
      document.getElementById(id).textContent = value === null || value === undefined || value === "" ? "—" : value;
    }

    async function loadDetail() {
      const { data: e } = await apiGet(`/employees/${employeeId}`);
      document.getElementById("pageTitle").textContent = e.display_name;
      setText("v_employee_code", e.employee_code);
      setText("v_status", e.employment_status);
      setText("v_email", e.email);
      setText("v_phone", e.phone);
      setText("v_department", e.department_name);
      setText("v_designation", e.designation_title);
      setText("v_manager", e.manager_name);
      setText("v_employment_type", e.employment_type);
      setText("v_date_of_joining", e.date_of_joining);
      setText("v_date_of_birth", e.date_of_birth);
      setText("v_gender", e.gender);
      setText("v_user", e.user_id ? "Linked" : "Not linked");
      document.getElementById("v_profile_picture").innerHTML = e.profile_picture_url
        ? `<a href="${escapeHtml(e.profile_picture_url)}" target="_blank" rel="noopener">View image</a>`
        : "—";
      setText("v_address", e.address);
      setText("v_city", e.city);
      setText("v_state", e.state);
      setText("v_country", e.country);
      setText("v_postal_code", e.postal_code);
      setText("v_emergency_contact", e.emergency_contact);

      if (e.notes) {
        document.getElementById("notesTitle").style.display = "block";
        const notesEl = document.getElementById("v_notes");
        notesEl.style.display = "block";
        notesEl.textContent = e.notes;
      }

      document.getElementById("transferDept").value = e.department_id || "";
      document.getElementById("changeDesig").value = e.designation_id || "";
      document.getElementById("assignManager").value = e.manager_id || "";

      if (e.user_id || !canReadUsers) {
        document.getElementById("linkUserField").style.display = "none";
        document.getElementById("linkUserBtnField").style.display = "none";
      }

      return e;
    }

    async function loadLookups() {
      const tasks = [
        apiGet("/departments" + toQueryString({ page: 1, page_size: 100 })),
        apiGet("/designations" + toQueryString({ page: 1, page_size: 100 })),
        apiGet("/employees" + toQueryString({ page: 1, page_size: 100 })),
      ];
      if (canReadUsers) {
        tasks.push(apiGet("/users" + toQueryString({ page: 1, page_size: 100 })));
      }
      const results = await Promise.allSettled(tasks);

      if (results[0].status === "fulfilled") departmentsCache = results[0].value.data;
      if (results[1].status === "fulfilled") designationsCache = results[1].value.data;
      if (results[2].status === "fulfilled") employeesCache = results[2].value.data;

      const deptSelect = document.getElementById("transferDept");
      for (const d of departmentsCache) {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = `${d.code} — ${d.name}`;
        deptSelect.appendChild(opt);
      }
      const desigSelect = document.getElementById("changeDesig");
      for (const d of designationsCache) {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.title;
        desigSelect.appendChild(opt);
      }
      const managerSelect = document.getElementById("assignManager");
      for (const emp of employeesCache) {
        if (emp.id === employeeId) continue;
        const opt = document.createElement("option");
        opt.value = emp.id;
        opt.textContent = `${emp.display_name} (${emp.employee_code})`;
        managerSelect.appendChild(opt);
      }

      if (canReadUsers && results[3] && results[3].status === "fulfilled") {
        const userSelect = document.getElementById("linkUser");
        for (const u of results[3].value.data) {
          const opt = document.createElement("option");
          opt.value = u.id;
          opt.textContent = `${u.username} (${u.email})`;
          userSelect.appendChild(opt);
        }
      }
    }

    async function refresh() {
      banner.innerHTML = "";
      await loadDetail();
    }

    document.getElementById("transferBtn").addEventListener("click", async () => {
      const department_id = document.getElementById("transferDept").value;
      if (!department_id) return showError(banner, { message: "Choose a department first." });
      try {
        await apiPost(`/employees/${employeeId}/transfer-department`, { department_id });
        banner.innerHTML = '<div class="success-banner">Department updated.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("desigBtn").addEventListener("click", async () => {
      const designation_id = document.getElementById("changeDesig").value;
      if (!designation_id) return showError(banner, { message: "Choose a designation first." });
      try {
        await apiPost(`/employees/${employeeId}/change-designation`, { designation_id });
        banner.innerHTML = '<div class="success-banner">Designation updated.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("managerBtn").addEventListener("click", async () => {
      const manager_id = document.getElementById("assignManager").value || null;
      try {
        await apiPost(`/employees/${employeeId}/assign-manager`, { manager_id });
        banner.innerHTML = '<div class="success-banner">Manager updated.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("linkUserBtn").addEventListener("click", async () => {
      const user_id = document.getElementById("linkUser").value;
      if (!user_id) return showError(banner, { message: "Choose a user account first." });
      try {
        await apiPost(`/employees/${employeeId}/link-user`, { user_id });
        banner.innerHTML = '<div class="success-banner">User account linked.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("deactivateBtn").addEventListener("click", async () => {
      if (!confirm("Deactivate this employee?")) return;
      try {
        await apiPost(`/employees/${employeeId}/deactivate`, {});
        banner.innerHTML = '<div class="success-banner">Employee deactivated.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("reactivateBtn").addEventListener("click", async () => {
      try {
        await apiPost(`/employees/${employeeId}/reactivate`, {});
        banner.innerHTML = '<div class="success-banner">Employee reactivated.</div>';
        await loadDetail();
      } catch (err) { showError(banner, err); }
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this employee? This cannot be undone.")) return;
      try {
        await apiDelete(`/employees/${employeeId}`);
        window.location.href = "./employees.html";
      } catch (err) { showError(banner, err); }
    });

    (async () => {
      try {
        await loadDetail();
        await loadLookups();
      } catch (err) {
        showError(banner, err);
      }
    })();
  </script>
      </main>
    </div>
  </div>
</body>
</html>
