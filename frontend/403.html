<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>403 Access Denied — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
        <div style="max-width: 560px; margin: 80px auto; padding: 40px; text-align: center; background: #ffffff; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;">
          <div style="font-size: 56px; margin-bottom: 16px;">🚫</div>
          <h2 style="font-size: 22px; font-weight: 700; color: #1a202c; margin-bottom: 8px;">403 - Access Denied</h2>
          <p style="color: #4a5568; font-size: 15px; line-height: 1.5; margin-bottom: 24px;" id="deniedMessage">
            You do not have the required permissions to access this page or module.
          </p>
          <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="./index.html" class="btn btn-primary" style="padding: 10px 24px; text-decoration: none; border-radius: 6px; font-weight: 600; background-color: #3182ce; color: #ffffff;">Return to Dashboard</a>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js?v=2"></script>
  <script>
    renderShell("403");
    const params = new URLSearchParams(window.location.search);
    const mod = params.get("module");
    if (mod) {
      document.getElementById("deniedMessage").innerHTML = `You do not have permission to access the <strong>${escapeHtml(mod)}</strong> module.`;
    }
  </script>
</body>
</html>
