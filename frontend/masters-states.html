<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>States — Inhyma ERP</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarMount"></div>
    <div class="main-column">
      <div id="topbarMount"></div>
      <main class="page">
        <div class="breadcrumb">
          <a href="./index.html">Dashboard</a><span class="sep">/</span><span class="current">Master Data</span><span class="sep">/</span><span class="current">States</span>
        </div>
        <div class="page-header">
          <div>
            <h1>States</h1>
            <div class="page-subtitle">Belongs to a country; state names are unique within their country.</div>
          </div>
          <div class="page-header-actions">
            <button class="btn" id="sampleTemplateBtn">📌 Sample Template</button>
            <div class="btn file-btn" id="importBtnWrapper">
              Import
              <input type="file" id="importInput" accept=".csv,.xlsx" />
            </div>
            <button class="btn" id="exportCsvBtn">Export CSV</button>
            <button class="btn" id="exportXlsxBtn">Export Excel</button>
            <button class="btn btn-primary" id="newBtn">+ New State</button>
          </div>
        </div>
        <div id="banner"></div>
        <div id="importSummary"></div>

        <div class="card">
          <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search name or code or Sr. No..." />
            <select id="countryFilter">
              <option value="">All countries</option>
            </select>
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th style="width: 40px;"><input type="checkbox" class="select-all-checkbox" /></th>
                  <th>Sr. No.</th>
                  <th>Name</th>
                  <th>Code</th>
                  <th>Country</th>
                  <th>Status</th>
                  <th>ACTION</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr><td colspan="6" class="muted">Loading...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">New State</h2>
        <button class="modal-close" id="modalCloseBtn">&times;</button>
      </div>
      <form id="entityForm">
        <input type="hidden" id="entityId" />
        <div class="form-grid">
          <div class="field">
            <label for="country_id">Country *</label>
            <select id="country_id" required>
              <option value="">-- Select Country --</option>
            </select>
          </div>
          <div class="field">
            <label for="name">State Name *</label>
            <input id="name" required maxlength="150" />
          </div>
          <div class="field">
            <label for="code">State Code</label>
            <input id="code" maxlength="20" />
          </div>
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/import-wizard.js"></script>
  <script src="js/masters-common.js"></script>
  <script>
    renderShell("masters-states");

    let countriesCache = [];

    function countryName(id) {
      const c = countriesCache.find((x) => x.id === id);
      return c ? c.name : "—";
    }

    MasterPage.init({
      apiBase: "/masters/states",
      permissionPrefix: "state",
      entityName: "state",
      importHeaders: [
        { key: "country_code", label: "Country Code", required: true },
        { key: "name", label: "State/Province Name", required: true },
        { key: "code", label: "State Code" },
        { key: "status", label: "Status (active/inactive)" },
      ],
      columns: [
        { header: "Name", render: (s) => `<span class="cell-primary">${escapeHtml(s.name)}</span>` },
        { header: "Code", render: (s) => escapeHtml(s.code || "—") },
        { header: "Country", render: (s) => escapeHtml(countryName(s.country_id)) },
        { header: "Status", render: (s) => MasterPage.badge(s.status) },
      ],
      extraFilters() {
        const val = document.getElementById("countryFilter").value;
        return val ? { country_id: val } : {};
      },
      async loadLookups() {
        try {
          const { data } = await apiGet("/masters/countries" + toQueryString({ page: 1, page_size: 250, sort_order: "asc", status: "active" }));
          countriesCache = data || [];
          const countrySelect = document.getElementById("country_id");
          const countryFilter = document.getElementById("countryFilter");
          
          countrySelect.innerHTML = countriesCache.length 
            ? '<option value="">-- Select Country --</option>' 
            : '<option value="">-- No Countries Found! Create Country First --</option>';

          countryFilter.innerHTML = '<option value="">All countries</option>';

          for (const c of countriesCache) {
            const opt1 = document.createElement("option");
            opt1.value = c.id;
            opt1.textContent = c.name;
            countrySelect.appendChild(opt1);

            const opt2 = document.createElement("option");
            opt2.value = c.id;
            opt2.textContent = c.name;
            countryFilter.appendChild(opt2);
          }
          document.getElementById("countryFilter").addEventListener("change", () => {
            document.getElementById("searchInput").dispatchEvent(new Event("input"));
          });
        } catch (e) {
          /* lookups handling */
        }
      },
      fillForm(item) {
        MasterPage.setFieldValue("country_id", item ? item.country_id : "");
        MasterPage.setFieldValue("name", item ? item.name : "");
        MasterPage.setFieldValue("code", item ? item.code : "");
        MasterPage.setFieldValue("status", item ? item.status : "active");
      },
      toPayload() {
        const cId = MasterPage.fieldValue("country_id");
        if (!cId) {
          throw new Error("Please select a valid Country.");
        }
        return {
          country_id: cId,
          name: MasterPage.fieldValue("name").trim(),
          code: MasterPage.fieldValue("code").trim() || null,
          status: MasterPage.fieldValue("status"),
        };
      },
    });
  </script>
</body>
</html>
